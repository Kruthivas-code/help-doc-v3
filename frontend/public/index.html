        <!-- SEO File Server - Handle robots.txt and sitemap.xml before React loads -->
        <script>
            (function() {
                const path = window.location.pathname;
                const apiBase = window.location.origin + '/api/seo';
                
                if (path === '/robots.txt' || path === '/sitemap.xml') {
                    // Fetch from API and replace entire document
                    fetch(apiBase + path)
                        .then(response => response.text())
                        .then(content => {
                            // Replace entire document with plain text
                            document.open();
                            document.write('<pre style="margin:0;font-family:monospace;white-space:pre-wrap;word-wrap:break-word;">' + content + '</pre>');
                            document.close();
                            
                            // Set content type in a meta tag for crawlers
                            const meta = document.createElement('meta');
                            meta.httpEquiv = 'Content-Type';
                            meta.content = path.endsWith('.xml') ? 'application/xml' : 'text/plain';
                            document.head.appendChild(meta);
                        })
                        .catch(error => {
                            console.error('Failed to load SEO file:', error);
                            // Fallback content
                            document.open();
                            if (path === '/robots.txt') {
                                document.write('<pre>User-agent: *\nAllow: /\nSitemap: https://help.emergent.sh/sitemap.xml\n</pre>');
                            } else {
                                document.write('<pre>&lt;?xml version="1.0" encoding="UTF-8"?&gt;&lt;urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"&gt;&lt;/urlset&gt;</pre>');
                            }
                            document.close();
                        });
                }
            })();
        </script>
